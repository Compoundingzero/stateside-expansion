name: Monitor live site
on:
  schedule:
    - cron: '55 7 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: monitor-live-site
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/monitor-site.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-site-monitor
          path: artifacts/site-monitor.json
          retention-days: 30
